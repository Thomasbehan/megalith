name: Create Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with 'v', e.g., v0.22.1

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to generate accurate release notes

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true # Keep as draft so zips can be added before clients download the source zipball
          prerelease: false
